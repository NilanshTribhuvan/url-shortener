server:
  port: 8080

spring:
  application:
    name: url-shortener
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: urlshortener

  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

app:


  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000



